site_name: Tramlines
site_description: A real fly's brain, copied synapse by synapse, running in a machine that can see its future.
docs_dir: docs
strict: true

theme:
  name: material
  palette:
    scheme: slate
    primary: black
    accent: amber
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Owner decisions: owner-decisions.md
  - Sources and access: sources-and-access.md
  - Honesty: honesty.md
  - The Book:
