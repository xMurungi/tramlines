[project]
name = "tramlines"
version = "0.0.1"
description = "A whole-brain emulation of the adult fruit fly, with a ghost that sees its future."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "xMurungi" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.6",
]
docs = [
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tramlines"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "data: needs the FlyWire v783 files in data/ (run scripts/fetch_data.py first)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "book"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tramlines"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
